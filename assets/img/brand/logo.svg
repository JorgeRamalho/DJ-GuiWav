<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">DJ GuiWave — selo de frequência</title>
  <desc id="logoDesc">Anel-radar e onda senoidal em degradê aurora: magenta, violeta, ciano e champanhe</desc>
  <defs>
    <linearGradient id="aurora" x1="8%" y1="92%" x2="94%" y2="10%">
      <stop offset="0%" stop-color="#E24CC8"/>
      <stop offset="28%" stop-color="#8B5CFF"/>
      <stop offset="62%" stop-color="#4AE8F0"/>
      <stop offset="100%" stop-color="#C9A35A"/>
    </linearGradient>
    <linearGradient id="plate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#12151F"/>
      <stop offset="100%" stop-color="#07080F"/>
    </linearGradient>
    <radialGradient id="core" cx="48%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#4AE8F0" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#8B5CFF" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#07080F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="48" fill="url(#plate)"/>
  <circle cx="100" cy="100" r="78" fill="url(#core)"/>
  <circle cx="100" cy="100" r="74" fill="none" stroke="url(#aurora)" stroke-width="1.25" opacity=".55"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#aurora)" stroke-width=".6" opacity=".28" stroke-dasharray="1.6 5.2"/>
  <path d="M42 104 C58 72 74 72 90 104 S122 136 138 104 S170 72 182 88" fill="none" stroke="url(#aurora)" stroke-width="7.5" stroke-linecap="round" filter="url(#soft)"/>
  <circle cx="90" cy="104" r="3.4" fill="#F4F1EA"/>
  <path d="M100 32 v10 M168 100 h-10 M100 168 v-10 M32 100 h10" stroke="url(#aurora)" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
</svg>
